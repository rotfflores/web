<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitudes — ROTF</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090816;color:#f6f3ff;font:15px system-ui,sans-serif}main{width:min(1180px,calc(100% - 32px));margin:auto;padding:42px 0}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}small{color:#b8ff4a;letter-spacing:.18em}h1{font:400 clamp(2.8rem,7vw,5.5rem)/.9 Georgia,serif;margin:.4rem 0}button{border:1px solid #ffffff26;background:#17142a;color:#fff;padding:.75rem 1rem;border-radius:8px;cursor:pointer}.grid{display:grid;gap:12px}.card{border:1px solid #ffffff1f;background:#121022;padding:22px;border-radius:16px}.top{display:flex;justify-content:space-between;gap:16px}.tag{color:#b8ff4a;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em}.date{color:#aaa4bd;font-size:.78rem}h2{margin:.7rem 0 .2rem;font-size:1.35rem}.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:#aaa4bd;font-size:.85rem}.message{white-space:pre-wrap;line-height:1.65;border-top:1px solid #ffffff17;margin-top:16px;padding-top:16px}.empty{padding:60px;text-align:center;color:#aaa4bd;border:1px dashed #ffffff30;border-radius:16px}.attachments{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:16px;margin-top:20px}.attachment{margin:0;min-width:0}.attachment img,.attachment video{display:block;width:100%;height:190px;object-fit:contain;background:#090816;border-radius:8px}.attachment figcaption{margin-top:9px;overflow-wrap:anywhere;color:#aaa4bd;font-size:.85rem}.attachment a{display:inline-block;color:#b8ff4a;margin-top:8px}#notice{color:#aaa4bd}@media(max-width:600px){header{align-items:start;flex-direction:column}.card{padding:18px}.top{flex-direction:column;gap:5px}}
</style></head><body><main><header><div><small>PANEL PRIVADO</small><h1>Solicitudes</h1></div><button id="refresh">Actualizar</button></header><p id="notice" role="status"></p><section id="list" class="grid"><div class="empty">Cargando solicitudes…</div></section></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function files(items){return items.length?'<div class="attachments">'+items.map(f=>{const url='/admin/attachments/'+encodeURIComponent(f.id);return '<figure class="attachment">'+(f.type.startsWith('image/')?'<img src="'+url+'" alt="'+esc(f.name)+'" loading="lazy">':'<video src="'+url+'" controls preload="none" playsinline></video>')+'<figcaption>'+esc(f.name)+' · '+(f.size/1048576).toFixed(1)+' MB</figcaption><a href="'+url+'?download=1">Descargar archivo</a></figure>'}).join('')+'</div>':''}
async function load(){const list=document.querySelector('#list'),button=document.querySelector('#refresh'),notice=document.querySelector('#notice');button.disabled=true;notice.textContent='';try{const r=await fetch('/admin/submissions',{credentials:'include',cache:'no-store'});if(r.status===401)throw Error('Tu sesión terminó. Recarga la página para iniciar sesión.');const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo cargar');list.innerHTML=d.results.length?d.results.map(x=>'<article class="card"><div class="top"><span class="tag">'+esc(x.project)+'</span><span class="date">'+new Date(x.created_at+'Z').toLocaleString('es-MX')+'</span></div><h2>'+esc(x.name)+'</h2><div class="meta"><span>'+esc(x.phone)+'</span><span>'+esc(x.email||'Sin correo')+'</span><span>'+esc(x.ideal_date||'Sin fecha')+'</span></div><div class="message">'+esc(x.message)+'</div>'+files(x.attachments||[])+'</article>').join(''):'<div class="empty">Todavía no hay solicitudes.</div>'}catch(e){notice.textContent=e.message;if(list.querySelector('.empty'))list.textContent='No se pudieron cargar las solicitudes.'}finally{button.disabled=false}}
document.querySelector('#refresh').addEventListener('click',load);load();
</script></body></html>
