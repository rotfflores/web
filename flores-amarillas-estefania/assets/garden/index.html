    <script>
      const holdSurface = document.getElementById("garden-hold");
      const progressLabel = document.getElementById("garden-progress-label");
      const progressLeaves = [...document.querySelectorAll("#garden-leaves i")];
      const gardenMessage = document.getElementById("garden-message");
      const gardenWord = document.getElementById("garden-word");
      const flowerWords = ["Alegría", "Luz", "Calma"];
      let progress = 0;
      let holding = false;
      let previousTime = 0;
      let animationFrame = 0;

      function renderProgress() {
        const percent = Math.round(progress * 100);
        document.body.style.setProperty("--garden-progress", progress);
        progressLabel.textContent = `Haciendo florecer… ${percent}%`;
        progressLeaves.forEach((leaf, index) => leaf.classList.toggle("is-lit", progress >= (index + 1) / 5));
      }

      function finishGarden() {
        progress = 1;
        holding = false;
        document.body.classList.remove("garden-paused", "is-holding");
        document.body.classList.add("garden-complete");
        renderProgress();
        parent.postMessage({ type: "garden-complete" }, location.origin);
      }

      function grow(time) {
        if (!holding || progress >= 1) return;
        if (!previousTime) previousTime = time;
        progress = Math.min(1, progress + (time - previousTime) / 7200);
        previousTime = time;
        renderProgress();
        if (progress >= 1) finishGarden();
        else animationFrame = requestAnimationFrame(grow);
      }

      function startGrowing(event) {
        if (progress >= 1) return;
        event.preventDefault();
        holding = true;
        previousTime = 0;
        document.body.classList.remove("garden-paused");
        document.body.classList.add("is-holding");
        holdSurface.setPointerCapture?.(event.pointerId);
        cancelAnimationFrame(animationFrame);
        animationFrame = requestAnimationFrame(grow);
      }

      function pauseGrowing() {
        if (!holding || progress >= 1) return;
        holding = false;
        cancelAnimationFrame(animationFrame);
        document.body.classList.add("garden-paused");
        document.body.classList.remove("is-holding");
      }

      holdSurface.addEventListener("pointerdown", startGrowing);
      holdSurface.addEventListener("pointerup", pauseGrowing);
      holdSurface.addEventListener("pointercancel", pauseGrowing);
      holdSurface.addEventListener("contextmenu", (event) => event.preventDefault());

      document.querySelectorAll(".flower").forEach((flower, index) => {
        flower.setAttribute("role", "button");
        flower.setAttribute("tabindex", "0");
        const react = () => {
          if (!document.body.classList.contains("garden-complete")) return;
          flower.classList.add("is-touched");
          gardenWord.textContent = flowerWords[index] || "Cariño";
          gardenWord.classList.remove("is-showing");
          void gardenWord.offsetWidth;
          gardenWord.classList.add("is-showing");
          if (document.querySelectorAll(".flower.is-touched").length === document.querySelectorAll(".flower").length) {
            setTimeout(() => { gardenWord.textContent = "Todo esto florece en mi vida gracias a ti."; gardenWord.classList.add("is-showing", "is-final"); }, 850);
          }
        };
        flower.addEventListener("click", react);
        flower.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") react(); });
      });

      renderProgress();
      addEventListener("message", (event) => {
        if (event.origin !== location.origin || event.data?.type !== "garden-config") return;
        gardenMessage.replaceChildren(...String(event.data.message).split(/(?<=\.)\s+/).map((line) => {
          const span = document.createElement("span");
          span.textContent = line;
          return span;
        }));
      });
    </script>
